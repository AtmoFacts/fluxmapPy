# CI for the standalone AtmoFacts/fluxmapPy repository.
#
# This file is INERT where it currently sits: GitHub Actions only reads
# workflows from `.github/workflows/` at a repository root, and this copy
# lives inside ext/fluxmapPy of the FluxMapper monorepo.
#
# To activate it, once fluxmapPy is split out into AtmoFacts/fluxmapPy:
#     mkdir -p .github/workflows
#     git mv ci/github-workflow.yml .github/workflows/ci.yml
#
# Paths assume pyproject.toml sits at the repository root, which is the
# case in the standalone repo. No working-directory or path filter needed.
#
# Third-party actions are pinned to full commit SHAs rather than tags, so a
# moved tag cannot change what executes. The trailing comment records the
# release each SHA corresponds to. To update a pin:
#     gh api repos/actions/checkout/git/ref/tags/<tag> --jq .object.sha
# and bump the comment alongside it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Any job needing more must opt in explicitly
# with its own `permissions:` block.
permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  build:
    name: build + twine check
    runs-on: ubuntu-latest
    # The package is pure Python, so one platform produces the same
    # py3-none-any wheel everywhere. No upload happens here: this job only
    # proves the distributions build and their metadata is valid. Publishing
    # is a separate, manually triggered workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: List what was built
        run: ls -l dist/

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    # Fails if a dependency arrives under a copyleft licence that is
    # incompatible with shipping fluxmappy under MIT. Adjust the deny list
    # if a reviewed exception is ever agreed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and pip-licenses
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." pip-licenses
      - name: Report dependency licences
        run: pip-licenses --format=markdown --with-urls
      - name: Fail on copyleft licences
        run: pip-licenses --fail-on="GPL;AGPL;LGPL;SSPL"

  secrets:
    name: credential scan
    runs-on: ubuntu-latest
    # High-signal patterns only. Matching on the bare word "token" or
    # "secret" produces false positives against docstrings and parameter
    # names, so this looks for credential formats rather than vocabulary.
    # For deeper history-aware scanning, add gitleaks as a pinned action.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for credential patterns
        run: |
          set -o pipefail
          PATTERNS='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{32,}'
          if git grep -nIE "$PATTERNS" -- . ':!*.ipynb'; then
            echo "::error::Possible credential found above. Remove it and rotate the key."
            exit 1
          fi
          echo "No credential patterns found."
      - name: Scan notebooks for outputs containing credentials
        run: |
          set -o pipefail
          if git grep -nIE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- '*.ipynb'; then
            echo "::error::Possible credential in a notebook. Clear outputs and rotate the key."
            exit 1
          fi
          echo "No credential patterns found in notebooks."

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rasterio and fiona publish wheels bundling GDAL for both platforms,
      # so no system GDAL install is required. If a wheel is ever missing for
      # a matrix entry, switch that entry to the conda route in
      # environment.yml.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Report resolved environment
        run: |
          python -c "import sys, numpy, rasterio, fiona; print(sys.version); print('numpy', numpy.__version__); print('rasterio', rasterio.__version__); print('fiona', fiona.__version__)"

      - name: Run tests and doctests
        run: python -m pytest
