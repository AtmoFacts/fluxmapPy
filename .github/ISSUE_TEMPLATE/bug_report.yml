name: Bug report
description: Something in fluxmappy behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include customer or site data, internal hostnames,
        bucket names, or credentials in this report. Reduce the problem to
        synthetic or public data before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what occurred instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest snippet that shows the problem. Synthetic rasters are
        fine — see the Examples sections in the docstrings for how the test
        suite builds them.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback
      description: Paste the complete traceback, not just the final line.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: fluxmappy version
      description: "Output of: python -c \"import fluxmappy; print(fluxmappy.__version__)\" or pip show fluxmappy"
      placeholder: "0.6.0"
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13", "other"]
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Linux", "macOS", "Windows", "other"]
    validations:
      required: true

  - type: input
    id: geo-stack
    attributes:
      label: rasterio and fiona versions
      description: "Output of: python -c \"import rasterio, fiona; print(rasterio.__version__, fiona.__version__)\""
      placeholder: "1.3.9 1.9.5"
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: How was it installed
      options: ["conda / mamba", "pip from GitHub", "pip from a local clone", "editable install", "other"]
    validations:
      required: false
