[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmappy"
version = "0.6.0"
description = "Quality filtering and polygon analysis for spatial flux rasters (FluxMaps)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt", "NOTICE.txt"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Allen Kaplan", email = "akaplan@atmofacts.com" }]
maintainers = [{ name = "AtmoFacts, LLC", email = "info@atmofacts.com"}]
keywords = ["eddy covariance", "flux map", "FluxMapper", "raster", "geofence", "diurnal cycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

dependencies = [
    "fiona>=1.9",
    "numpy>=1.24",
    "rasterio>=1.3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-licenses", "pre-commit", "build", "twine", "nbmake", "jupytext"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]


[project.urls]
Repository = "https://github.com/AtmoFacts/fluxmapPy"
Issues = "https://github.com/AtmoFacts/fluxmapPy/issues"
Changelog = "https://github.com/AtmoFacts/fluxmapPy/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

# [project.scripts] is intentionally absent: a console entry point is earmarked for after 1.0.

# pep8-naming (N8xx) is enabled in full and deliberately has no exclusions.
# The eddy4R vocabulary does not trip it: N8xx rules police letter case, not
# word choice, and `wrap_diu`, `def_diu_calc`, `modl_filt` and `qf_thsh` are
# all valid lowercase_with_underscores. Add a targeted ignore below only if a
# real violation appears, and note which eddy4R term caused it.

[tool.ruff.lint.isort]
known-first-party = ["fluxmappy"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "src/fluxmappy"]
addopts = [
    "--doctest-modules",
    "--import-mode=importlib",
    "-ra",
]
# Each wrapper function shares its module's name, so the default "prepend"
# import mode can bind the function where a module is expected. importlib
# mode resolves the module correctly.

[tool.setuptools.package-data]
# PEP 561: ship the marker so type checkers use the annotations downstream.
fluxmappy = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fluxmappy*"]
